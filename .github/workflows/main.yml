name: Supabase Heartbeat

on:
  schedule:
    - cron: '0 12 */5 * *'   # every 5 days at noon UTC — comfortable margin inside the 7-day pause window
  workflow_dispatch:          # lets you trigger it manually to test

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit the Supabase REST API
        run: |
          curl -sf "${{ secrets.SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
